[package]
name = "dmgtile"
version = "1.0.0"
edition = "2024"

[dependencies]
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
image = { version = "0.25", features = ["png"] }
winres = "0.1.12"
gpui = { version = "=0.3.5", package = "gpui-pre", features = ["objc2", "objc2-metal"] }
gpui_platform = { version = "=0.3.5", package = "gpui-pre-platform", features = ["font-kit", "x11", "wayland"] }

[package.metadata.bundle]
name = "DMGTile"
identifier = "com.wirenux.dmgtile"
icon = ["assets/macos/AppIcon.icns", "assets/default_512.png"]
