[package]
name = "dmgtile"
version = "1.0.0"
edition = "2024"

[dependencies]
eframe = "0.36.1"
egui = "0.36.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
egui_extras = { version = "0.36.1", features = ["image"] }
image = { version = "0.25", features = ["png"] }
winres = "0.1.12"
gpui = { git = "https://github.com/zed-industries/zed", rev = "20d3cd1", package = "gpui", features = ["objc2", "objc2-metal"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "20d3cd1", package = "gpui_platform", features = ["font-kit"] }

[package.metadata.bundle]
name = "DMGTile"
identifier = "com.wirenux.dmgtile"
icon = ["assets/macos/AppIcon.icns", "assets/default_512.png"]

[[bin]]
name = "DMGTile"
path = "src/bin/dmgtile_gpui.rs"
